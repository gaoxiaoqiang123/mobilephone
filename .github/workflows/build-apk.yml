name: Build Kivy APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Buildozer打包Kivy安卓APK
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer-spec: ./buildozer.spec
    - name: 上传编译好的APK
      uses: actions/upload-artifact@v4
      with:
        path: ./bin/*.apk
